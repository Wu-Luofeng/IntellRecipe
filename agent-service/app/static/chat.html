<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智膳助手 · IntellRecipe Agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #f4f6f9; color: #2c2c2a; height: 100vh; display: flex; flex-direction: column; }
  header { background: #fff; border-bottom: 1px solid #e3e3de; padding: 10px 16px;
           display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header .logo { font-size: 16px; font-weight: 500; }
  header .logo span { color: #0f6e56; }
  header .field { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #5f5e5a; }
  header input { width: 72px; padding: 4px 8px; border: 1px solid #d3d1c7; border-radius: 6px; font-size: 12px; }
  header .spacer { flex: 1; }
  header button { padding: 5px 12px; border: 1px solid #0f6e56; color: #0f6e56; background: #e1f5ee;
                  border-radius: 6px; cursor: pointer; font-size: 12px; }
  header button:hover { background: #9fe1cb; }
  header .sid { font-size: 11px; color: #888780; max-width: 200px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.65;
            word-break: break-word; }
  .user .bubble { background: #185fa5; color: #fff; border-bottom-right-radius: 4px; }
  .bot  .bubble { background: #fff; border: 1px solid #e3e3de; border-bottom-left-radius: 4px; }
  .bubble p { margin: 4px 0; } .bubble ul, .bubble ol { margin: 4px 0 4px 18px; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 14px; margin: 8px 0 4px; }
  .bubble blockquote { border-left: 3px solid #d3d1c7; color: #5f5e5a; padding-left: 8px; margin: 6px 0; }
  .bubble strong { font-weight: 500; }
  .bubble table { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
  .bubble th, .bubble td { border: 1px solid #e3e3de; padding: 4px 8px; }
  .trace { max-width: 78%; font-size: 11px; color: #5f5e5a; margin-top: -6px; }
  .trace details { background: #f1efe8; border-radius: 8px; padding: 6px 10px; }
  .trace summary { cursor: pointer; user-select: none; }
  .trace code { color: #534ab7; }
  .tool-live { max-width: 78%; font-size: 11px; color: #534ab7; background: #eeedfe;
               border-radius: 8px; padding: 5px 10px; }
  .typing { color: #888780; font-size: 13px; padding: 4px 14px; display: none; }
  footer { background: #fff; border-top: 1px solid #e3e3de; padding: 10px 16px; display: flex; gap: 10px; }
  #input { flex: 1; resize: none; border: 1px solid #d3d1c7; border-radius: 10px; padding: 10px 12px;
           font-size: 14px; font-family: inherit; height: 64px; outline: none; }
  #input:focus { border-color: #0f6e56; }
  #send { width: 84px; border: none; background: #0f6e56; color: #fff; border-radius: 10px;
          cursor: pointer; font-size: 14px; }
  #send:disabled { background: #9fe1cb; cursor: not-allowed; }
  .hint { text-align: center; color: #888780; font-size: 12px; padding: 8px; }
</style>
</head>
<body>
<header>
  <div class="logo">🥗 智膳助手 <span>IntellRecipe Agent</span></div>
  <div class="spacer"></div>
  <div class="field">用户ID <input id="userId" type="number" placeholder="未登录"></div>
  <span class="sid" id="sidLabel"></span>
  <button id="newChat">＋ 新对话</button>
</header>

<div id="msgs"><div class="hint">你好！我是智膳助手，可以解答健康饮食问题、按你的偏好推荐菜品。试试问我："帮我算算 175cm 70kg 的 BMI" 或 "今晚吃点什么好？"</div></div>
<div class="typing" id="typing">正在连接 Agent 服务…</div>

<footer>
  <textarea id="input" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
  <button id="send">发送</button>
</footer>

<script>
const API = location.origin;                       // 同源部署；若页面放 Nginx 下改为 http://localhost:8800
const LS_SID = 'agent_session_id', LS_UID = 'agent_user_id';
const $ = id => document.getElementById(id);
const msgs = $('msgs'), typing = $('typing'), input = $('input'), sendBtn = $('send');
let sessionId = localStorage.getItem(LS_SID) || null;
let busy = false;

$('userId').value = localStorage.getItem(LS_UID) || '';
function renderMarkdown(text) {
  if (window.marked) { try { return marked.parse(text, { breaks: true }); } catch (e) {} }
  return '<p>' + text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>') + '</p>';
}
function addBubble(role, html) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const b = document.createElement('div');
  b.className = 'bubble'; b.innerHTML = html;
  row.appendChild(b); msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return b;
}
function addTrace(trace) {
  if (!trace || !trace.length) return;
  const row = document.createElement('div');
  row.className = 'row bot';
  const d = document.createElement('details'); d.className = 'trace';
  d.innerHTML = '<summary>🔧 调用了 ' + trace.length + ' 个工具</summary>' +
    trace.map(t => '<div><code>' + t.tool + '</code> → ' +
      String(t.result).replace(/&/g,'&amp;').replace(/</g,'&lt;').slice(0, 160) + '…</div>').join('');
  row.appendChild(d); msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}
function setSession(sid) {
  sessionId = sid;
  if (sid) { localStorage.setItem(LS_SID, sid); $('sidLabel').textContent = '会话 ' + sid.slice(0, 10) + '…'; }
  else { localStorage.removeItem(LS_SID); $('sidLabel').textContent = '新会话'; }
}
async function restoreHistory() {
  if (!sessionId) return;
  try {
    const res = await fetch(API + '/agent/chat/' + sessionId + '/history');
    const data = await res.json();
    (data.messages || []).forEach(m => addBubble(m.role === 'user' ? 'user' : 'bot',
                                                renderMarkdown(m.content)));
    if ((data.messages || []).length) msgs.appendChild(Object.assign(document.createElement('div'),
      { className: 'hint', textContent: '—— 已恢复上一会话的上下文 ——' }));
  } catch (e) { /* 服务端历史不可用则静默 */ }
}

/* ── 流式发送：SSE（工具事件 + 回答增量逐字渲染） ── */
async function send() {
  if (busy) return;
  const text = input.value.trim();
  if (!text) return;
  busy = true; sendBtn.disabled = true; input.value = '';
  addBubble('user', renderMarkdown(text));
  typing.style.display = 'none';

  const uid = $('userId').value.trim();
  if (uid) localStorage.setItem(LS_UID, uid); else localStorage.removeItem(LS_UID);

  const bubble = addBubble('bot', '');
  let live = null, content = '', trace = [], ok = false;

  try {
    const res = await fetch(API + '/agent/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text, session_id: sessionId,
        user_id: uid ? Number(uid) : null
      })
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        for (const line of frame.split('\n')) {
          if (!line.startsWith('data:')) continue;
          let ev; try { ev = JSON.parse(line.slice(5)); } catch (e) { continue; }

          if (ev.type === 'start') { setSession(ev.session_id); }
          else if (ev.type === 'round') { content = ''; }   // 新一轮工具轮：重置文本缓冲
          else if (ev.type === 'delta') {
            content += ev.content;
            bubble.innerHTML = renderMarkdown(content);
            msgs.scrollTop = msgs.scrollHeight;
          }
          else if (ev.type === 'tool') {
            trace.push({ tool: ev.name, result: ev.result });
            if (!live) { live = document.createElement('div'); live.className = 'row bot';
              live.innerHTML = '<div class="tool-live"></div>'; msgs.appendChild(live); }
            live.firstChild.textContent = '🔧 ' + ev.name + ' 完成，正在整理结果…';
            msgs.scrollTop = msgs.scrollHeight;
          }
          else if (ev.type === 'done') {
            ok = true; setSession(sessionId);
            bubble.innerHTML = renderMarkdown(ev.reply || content);
            trace = ev.trace || trace;
            if (live) { live.remove(); live = null; }
            addTrace(trace);
          }
          else if (ev.type === 'error') {
            if (live) { live.remove(); live = null; }
            bubble.innerHTML = '<p>⚠️ ' + String(ev.error).replace(/</g,'&lt;') + '</p>';
            ok = true;
          }
        }
      }
    }
    if (!ok && !content) bubble.innerHTML = '<p>⚠️ 连接中断，请重试。</p>';
  } catch (e) {
    bubble.innerHTML = '<p>⚠️ 请求失败：' + e.message + '</p>';
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
    msgs.scrollTop = msgs.scrollHeight;
  }
}
sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('newChat').addEventListener('click', () => {
  setSession(null); msgs.innerHTML = '';
  msgs.appendChild(Object.assign(document.createElement('div'),
    { className: 'hint', textContent: '已开启新对话（服务端旧会话仍保留，可刷新恢复）' }));
});
$('userId').addEventListener('change', e => {
  const v = e.target.value.trim();
  v ? localStorage.setItem(LS_UID, v) : localStorage.removeItem(LS_UID);
});
setSession(sessionId);
restoreHistory();
input.focus();
</script>
</body>
</html>
