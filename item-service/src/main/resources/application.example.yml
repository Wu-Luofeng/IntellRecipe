server:
  port: 8082

spring:
  application:
    name: item-service

  # MySQL Configuration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:intell_recipe}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}

  # Redis Configuration
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:123321}
    database: ${REDIS_DATABASE:0}
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 32
        max-wait: 8000ms
        max-idle: 16
        min-idle: 2

  # Elasticsearch Configuration
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://127.0.0.1:9200}

  # Nacos Config
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

# MyBatis Plus Configuration
mybatis-plus:
  configuration:
    # 【不要用 StdOutImpl】它绕过日志框架，把每条 SQL 和完整结果集直接 System.out 打出。
    # 配合定时任务里的高频查询（EsSyncTask 每 10 秒探测一次），
    # 几天就能把日志文件刷到 GB 级 —— 实测 5.4GB，几乎全是 SQL 结果集。
    # Slf4jImpl 交给日志框架统一管控：可按包调级别、有轮转上限。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志
logging:
  level:
    root: info
    com.springboot.intellrecipe: info
    # MyBatis 以 Mapper 接口全限定名作为 logger 名，SQL 明细是 DEBUG 级。
    # 上面 root=info 已让它不输出；排查 SQL 时把对应 mapper 包临时改成 debug 即可。
  file:
    # 由日志框架直接写文件并轮转（不再依赖 nohup 重定向，避免两个句柄写同一文件）
    name: ${LOG_PATH:./logs}/item-service.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 7
      total-size-cap: 1GB
